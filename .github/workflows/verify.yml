name: Certificate replay
on: [push, pull_request, workflow_dispatch]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-flint==0.9.0
      - run: python -B code/check_manifest.py
      - run: python -B code/replay.py "$RUNNER_TEMP/prophet-replay"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-replay
          path: ${{ runner.temp }}/prophet-replay
